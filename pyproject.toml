[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-webhook-bridge"
version = "0.2.0"
description = "Fixture-safe FastAPI webhook bridge for validation, mapping, idempotency, and audit-controlled integrations"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "automation-kit @ git+https://github.com/stefan-mcf/automation-kit.git@b4b1df2730bc928b8c9ee96f716b706b41856cf1",
    "fastapi>=0.110.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "uvicorn>=0.29.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0",
    "ruff>=0.4.0,<1.0",
    "mypy>=1.10.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "Pillow>=10.0.0,<13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api_webhook_bridge*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
